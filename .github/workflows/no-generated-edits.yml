name: no-generated-edits

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block manual edits to subscriptions/
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED="$(git diff --name-only "${BASE}...HEAD" | grep -E '^subscriptions/' || true)"
          if [ -n "$CHANGED" ]; then
            echo "::error::subscriptions/ is generated by CI (autobuild) from src/. Do not edit it manually."
            echo "Changed files:"
            echo "$CHANGED"
            exit 1
          fi
