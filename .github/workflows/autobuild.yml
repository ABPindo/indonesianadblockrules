name: autobuild

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          python: 'true'
          node-packages: 'fop-cli,@adguard/aglint'

      - name: Run AGLint
        run: bash tools/lint.sh

      # pull before the build: build tools dirty the tree (fop rewrites src/,
      # CRLF normalization phantoms), which makes pull --rebase fail afterwards
      - name: Pull latest
        run: git pull --rebase

      - name: Build subscriptions
        run: bash tools/build.sh all

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: auto-build subscriptions [skip ci]"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
